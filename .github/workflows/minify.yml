name: Minify JavaScript Packages

on:
  push:
    branches:
      - main
    paths:
      - 'core/**/*.js'
      - 'packages/**/*.js'
  release:
    types: [published]

jobs:
  minify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install terser
        run: npm install -g terser
      
      - name: Create dist directory structure
        run: |
          # Dynamically create dist directories based on source structure
          find core packages -type f -name '*.js' -exec dirname {} \; | sed 's|^|dist/|' | sort -u | xargs mkdir -p
      
      - name: Minify core files
        run: |
          if [ -f core/index.js ]; then
            terser core/index.js -c -m --comments false -o dist/core/index.min.js
          fi
      
      - name: Minify package files
        run: |
          # Dynamically process all package directories
          for dir in packages/*/; do
            if [ -f "$dir/index.js" ]; then
              terser "$dir/index.js" -c -m --comments false -o "dist/$dir/index.min.js"
            fi
          done
      
      - name: Commit minified files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dist/
          git diff --staged --quiet || git commit -m "Auto-minify: ${{ github.event_name }} on ${{ github.ref_name }}"
      
      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
